<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hippo Exchange — Notifications</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="relative min-h-screen overflow-hidden">
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-20 hidden md:hidden"></div>

  <div class="flex flex-col md:flex-row h-screen max-h-screen relative">
    <!-- Mobile hamburger -->
    <div class="md:hidden fixed top-4 left-4 z-50">
      <button id="menu-button" class="glassy text-white/90 focus:outline-none px-3 py-3 rounded-lg"
        aria-expanded="false" aria-controls="sidebar" aria-label="Toggle menu">
        <svg id="icon-ham" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar"
      class="glass-dark md:w-1/4 lg:w-1/5 xl:w-1/6 p-4 flex flex-col space-y-4 md:static absolute top-0 left-0 h-full z-30 md:z-auto transform -translate-x-full md:translate-x-0 transition-transform duration-300"
      aria-label="Primary">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="h-10 w-10 rounded-xl overflow-hidden border-2 border-white/50 bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 shadow-lg">
            <img src="hippo-exchange-logo.png" alt="Hippo Exchange Logo" class="w-full h-full object-cover" />
          </div>
          <h1 class="text-lg font-bold">Hippo Exchange</h1>
        </div>
        <button id="close-menu" class="md:hidden text-gray-300 hover:text-white" aria-label="Close sidebar">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="relative mt-4">
        <input type="text" placeholder="Search Hippo Exchange"
          class="input w-full pl-10 pr-4 py-2 rounded-lg text-slate-800 placeholder-slate-500"
          aria-label="Search Hippo Exchange">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <nav class="flex-grow dark-scrollbar overflow-y-auto mt-4">
        <ul class="space-y-2">
          <li><a href="./Home.html" class="nav-link"><span class="icon-doc"></span><span>Browse all</span></a></li>
          <li><a href="./asset-hub.html" class="nav-link"><span class="icon-briefcase"></span><span>Asset Hub</span></a>
          </li>
          <li><a href="./notifications.html" class="nav-link"><span
                class="icon-bell"></span><span>Notifications</span></a></li>
          <li><a href="./inbox.html" class="nav-link"><span class="icon-mail"></span><span>Messaging</span></a></li>
          <li class="mt-2"><span class="text-xs uppercase tracking-wide text-slate-300/80">Actions</span></li>
          <li>
            <a href="./create-listing.html" class="btn-primary w-full block text-center">+ Create new listing</a>
          </li>
          <li>
            <a href="./calendar.html" class="btn-primary w-full block text-center">📅 Calendar view</a>
          </li>
        </ul>
      </nav>

      <section class="mt-auto pt-4" aria-label="Account">
        <h3 class="font-semibold text-slate-200 mb-2">Account</h3>
        <div class="glass p-3 rounded-lg">
          <div class="flex items-center gap-3">
            <div id="acct-avatar" class="w-9 h-9 rounded-full border-2 border-white/50 bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 shadow-lg flex items-center justify-center text-white font-bold text-sm">
            </div>
            <div class="min-w-0">
              <p id="acct-name" class="font-semibold text-slate-900 truncate">Username</p>
            </div>
          </div>
          <!-- Balance removed per UX request -->
          <div class="mt-3 grid grid-cols-2 gap-2">
            <a href="./profile.html"
              class="text-center text-sm font-semibold px-3 py-2 rounded-md bg-slate-900/80 text-white hover:bg-slate-900">Manage</a>
            <a href="./Login.html"
              class="text-center text-sm font-semibold px-3 py-2 rounded-md bg-white/40 text-slate-900 hover:bg-white/60">Sign
              out</a>
          </div>
        </div>
      </section>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto dark-scrollbar">
      <header class="glass p-4 mb-6">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold text-slate-800">Notifications</h2>
          <div class="flex gap-2">
            <button id="mark-all" class="btn-primary">Mark all read</button>
          </div>
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
          <button data-filter="all"
            class="px-3 py-1.5 rounded-md bg-slate-900/80 text-white text-sm font-semibold">All</button>
          <button data-filter="unread"
            class="px-3 py-1.5 rounded-md bg-white/40 text-slate-900 text-sm font-semibold">Unread</button>
          <button data-filter="exchange_request"
            class="px-3 py-1.5 rounded-md bg-white/40 text-slate-900 text-sm font-semibold">Requests</button>
          <button data-filter="exchange_cancelled"
            class="px-3 py-1.5 rounded-md bg-white/40 text-slate-900 text-sm font-semibold">Cancelled</button>
          <button data-filter="message"
            class="px-3 py-1.5 rounded-md bg-white/40 text-slate-900 text-sm font-semibold">Messages</button>
          <button data-filter="system"
            class="px-3 py-1.5 rounded-md bg-white/40 text-slate-900 text-sm font-semibold">System</button>
        </div>
      </header>

      <section class="max-w-3xl mx-auto glass p-0 rounded-lg overflow-hidden">
        <ul id="notifs-list" class="divide-y divide-slate-200"></ul>
        <div id="empty-state" class="hidden p-10 text-center text-slate-600">
          <div class="mx-auto w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-[#2563eb] mb-3">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          </div>
          <p class="font-semibold">You're all caught up</p>
          <p class="text-sm">New notifications will appear here.</p>
        </div>
      </section>
    </main>
  </div>

  <script defer src="./home.js"></script>
  <script defer src="./profile-utils.js"></script>
  <script defer src="./notifications.js"></script>
</body>

</html>
